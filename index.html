<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU FIX & STORE</title>


<link rel="stylesheet" href="style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>


<header>

    <nav class="navbar">

        <div class="navbar-izquierda">

            <a class="navbar-brand" href="index.html">
                GPU FIX & STORE
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link active" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="reparar.html">
                        Reparar GPU
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="carrito.html">
                        Ver carrito
                    </a>
                </li>

            </ul>

        </div>

        <div class="navbar-centro">

            <form class="search-form" action="busqueda.html" method="GET" role="search">

                <input class="form-control"
                    type="search"
                    name="buscar"
                    placeholder="Buscar GPU"
                    aria-label="Buscar GPU">

                <button class="btn" type="submit">
                    Buscar
                </button>

            </form>

        </div>

        <div class="navbar-derecha">

            <button id="themeButton" class="theme-button">
                ☀️
            </button>

        </div>

    </nav>

</header>

<main>

    <section class="buscados">

        <h2>Los más buscados</h2>

        <div id="carruselProductos" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">

            <div class="carousel-inner">

                <div class="carousel-item active">

                    <a href="3090.html">
                        <img src="img/3090.jpg"
                            class="d-block carrusel-imagen"
                            alt="NVIDIA GeForce RTX 3090">
                    </a>

                    <h3>RTX 3090</h3>

                </div>

                <div class="carousel-item">

                    <a href="2080.html">
                        <img src="img/2080.jpg"
                            class="d-block carrusel-imagen"
                            alt="NVIDIA GeForce RTX 2080">
                    </a>

                    <h3>RTX 2080</h3>

                </div>

            </div>

            <button class="carousel-control-prev"
                type="button"
                data-bs-target="#carruselProductos"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon" aria-hidden="true"></span>

                <span class="visually-hidden">
                    Anterior
                </span>

            </button>

            <button class="carousel-control-next"
                type="button"
                data-bs-target="#carruselProductos"
                data-bs-slide="next">

                <span class="carousel-control-next-icon" aria-hidden="true"></span>

                <span class="visually-hidden">
                    Siguiente
                </span>

            </button>

        </div>

    </section>

</main>

<footer>

    <p>GPU FIX & STORE - Reparación y venta de GPUs</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const themeButton = document.getElementById("themeButton");

    themeButton.addEventListener("click", function() {

        document.body.classList.toggle("light-theme");

        if (document.body.classList.contains("light-theme")) {
            themeButton.textContent = "🌙";
        } else {
            themeButton.textContent = "☀️";
        }

    });

</script>


</body>

</html>
