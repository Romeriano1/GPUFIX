<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU FIX & STORE</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="navbar-izquierda">

                <a class="navbar-brand" href="index.html">
                    GPU FIX & STORE
                </a>

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="reparar.html">
                            Reparar GPU
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">
                            Ver carrito
                        </a>
                    </li>

                </ul>

            </div>

            <div class="navbar-centro">

                <form class="search-form" action="busqueda.html" method="GET" role="search">

                    <input class="form-control"
                        type="search"
                        name="buscar"
                        placeholder="Buscar GPU"
                        aria-label="Buscar GPU">

                    <button class="btn" type="submit">
                        Buscar
                    </button>

                </form>

            </div>

            <div class="navbar-derecha">

                <button id="themeButton" class="theme-button">
                    ☀️
                </button>

            </div>

        </nav>

    </header>

    <main>

        <section class="buscados">

            <h2>Los más buscados</h2>

            <div class="productos">

                <div class="producto">

                    <a href="3090.html">
                        <img src="img/3090.jpg" alt="NVIDIA GeForce RTX 3090">
                    </a>

                    <h3>RTX 3090</h3>

                </div>

                <div class="producto">

                    <a href="2080.html">
                        <img src="img/2080.jpg" alt="NVIDIA GeForce RTX 2080">
                    </a>

                    <h3>RTX 2080</h3>

                </div>

            </div>

        </section>

    </main>

    <footer>

        <p>GPU FIX & STORE - Reparación y venta de GPUs</p>

    </footer>

    <script>

        const themeButton = document.getElementById("themeButton");

        themeButton.addEventListener("click", function () {

            document.body.classList.toggle("light-theme");

            if (document.body.classList.contains("light-theme")) {
                themeButton.textContent = "🌙";
            } else {
                themeButton.textContent = "☀️";
            }

        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwxH9j09JcYn3nv7wiPVlz7YYwJrVVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
