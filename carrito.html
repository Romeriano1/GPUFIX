<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - GPU FIX & STORE</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="navbar-izquierda">

                <a class="navbar-brand" href="index.html">
                    GPU FIX & STORE
                </a>

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="reparar.html">
                            Reparar GPU
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="carrito.html">
                            Ver carrito
                        </a>
                    </li>

                </ul>

            </div>

            <div class="navbar-derecha">

                <button id="themeButton" class="theme-button" type="button" aria-label="Cambiar tema">
                    ☀️
                </button>

                <div class="cuenta-contenedor">

                    <button
                        id="cuentaButton"
                        class="cuenta-button"
                        type="button"
                        aria-label="Abrir menú de usuario"
                        aria-expanded="false">
                        👤
                    </button>

                    <div id="cuentaMenu" class="cuenta-menu">
                        <a href="login.html">Iniciar sesión</a>
                    </div>

                </div>

            </div>

        </nav>

    </header>

    <main>

        <section class="carrito-vacio">

            <h2>Tu carrito está vacío</h2>

            <p>
                Todavía no agregaste ningún producto a tu carrito.
            </p>

            <p>
                Explorá nuestros productos y encontrá la GPU que estás buscando.
            </p>

            <a href="productos.html" class="boton-maps">
                Ver productos
            </a>

        </section>

    </main>

    <footer>

        <p>GPU FIX & STORE - Reparación y venta de GPUs</p>

    </footer>

    <script src="script.js"></script>

    <script>
        const cuentaButton = document.getElementById("cuentaButton");
        const cuentaMenu = document.getElementById("cuentaMenu");

        cuentaButton.addEventListener("click", function(event) {
            event.stopPropagation();

            const abierto = cuentaMenu.classList.toggle("visible");
            cuentaButton.setAttribute("aria-expanded", abierto);
        });

        document.addEventListener("click", function(event) {
            if (!event.target.closest(".cuenta-contenedor")) {
                cuentaMenu.classList.remove("visible");
                cuentaButton.setAttribute("aria-expanded", "false");
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
